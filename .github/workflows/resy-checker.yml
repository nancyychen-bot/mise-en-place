name: Resy Checker                                                                                                                                     
                                                                                                                                                         
  on:                                                                                                                                                  
    schedule:                                                                                                                                            
      - cron: '*/5 12-23,0-2 * * *'                                                                                                                    
    workflow_dispatch: {}

  concurrency:
    group: resy-checker
    cancel-in-progress: false
                                                                                                                                                         
  jobs:
    check:                                                                                                                                               
      runs-on: ubuntu-latest                                                                                                                           
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
                                                                                                                                                         
        - uses: actions/setup-node@v4
          with:                                                                                                                                          
            node-version: '22'                                                                                                                         
            cache: 'npm'
            cache-dependency-path: scripts/resy-checker/package-lock.json
                                                                                                                                                         
        - name: Install dependencies
          working-directory: scripts/resy-checker                                                                                                        
          run: npm ci                                                                                                                                  
                                                                                                                                                         
        - name: Run Resy checker
          working-directory: scripts/resy-checker                                                                                                        
          env:                                                                                                                                         
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}                                                                          
            RESY_API_KEY: ${{ secrets.RESY_API_KEY }}                                                                                                    
          run: node check.js
