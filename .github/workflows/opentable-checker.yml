name: OpenTable Checker

on:
  schedule:
    - cron: '*/5 12-23,0-6 * * *'  # Every 5 min during 8am-2am EDT
  workflow_dispatch: {}

concurrency:
  group: opentable-checker
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/opentable-checker/package-lock.json

      - name: Install dependencies
        working-directory: scripts/opentable-checker
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/opentable-checker/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: scripts/opentable-checker
        run: npx playwright install --with-deps chromium

      - name: Run OpenTable checker
        working-directory: scripts/opentable-checker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run node check.js
